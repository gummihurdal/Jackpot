name: News collector

on:
  schedule:
    # every 4 hours on weekdays, offset from the nightly scan
    - cron: "10 2,6,10,14,18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - run: python collect_news.py
      - name: Commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/db/news.parquet
          git diff --cached --quiet || git commit -m "News $(date -u +'%F %H:%M')"
          git push origin HEAD:main
          git push --force origin HEAD:gh-pages
