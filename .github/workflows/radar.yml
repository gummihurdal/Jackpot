name: Spring Radar scan

on:
  schedule:
    # 22:40 UTC Monday-Friday, after the US close
    - cron: "40 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python scan.py
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Radar scan $(date -u +%F)"
          git push origin HEAD:main
          # the website is served from the gh-pages branch, keep it identical to main
          git push --force origin HEAD:gh-pages
